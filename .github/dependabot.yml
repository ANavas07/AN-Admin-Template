version: 2

# Cadencia mensual y agrupada: un solo PR por ecosistema, en vez de uno por
# paquete. Las alertas de seguridad NO pasan por aqui: se activan en
# Settings > Code security y llegan al instante, sin esperar al mes.

updates:
  # Dependencias de package.json (pnpm entra en la categoria npm).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
          - major
    labels:
      - dependencies

  # Las GitHub Actions tambien son dependencias, y corren con acceso a tu
  # repositorio. Pocas y de cambio lento, pero conviene no dejarlas atras.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      all-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
          - major
    labels:
      - dependencies
      - github-actions
